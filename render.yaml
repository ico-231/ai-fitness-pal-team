# Deploy 1-click lên Render.com: New + → Blueprint → chọn repo này.
services:
  - type: web
    name: fitbro-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitbro-db
          property: connectionString
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
databases:
  - name: fitbro-db
    plan: free
