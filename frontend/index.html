<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eceef0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="FitBro AI — trợ lý thể hình đa tác tử: HLV tập luyện, chuyên gia dinh dưỡng, camera chỉnh form." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>FitBro AI</title>
    <script>
      // áp dụng theme trước khi render để tránh nháy màn hình
      (function () {
        try {
          var t = localStorage.getItem("fitbro_theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
