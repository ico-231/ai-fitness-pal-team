    <title>FitBro AI</title>
    <script>
      // màn khởi động khi mở từ màn hình chính: cố định theo chiều cao thật của màn hình (xem html.boot-fixed #boot)
      (function () {
        try {
          if (window.matchMedia("(display-mode: standalone)").matches || navigator.standalone) {
            var r = document.documentElement;
            r.classList.add("boot-fixed");
            r.style.setProperty("--boot-h", Math.max(screen.width, screen.height) + "px");
          }
        } catch (e) {}
      })();
      // áp dụng theme trước khi render để tránh nháy màn hình
      (function () {
        try {
          var t = localStorage.getItem("fitbro_theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
    <!-- BOOT:CSS — màn khởi động (hiện ngay khi mở app, trước khi JS tải xong). scripts/gen-splash.py đọc khối này
         để vẽ ảnh màn chờ iOS, nên ảnh chờ và màn khởi động trùng vị trí — chuyển từ ảnh sang màn này không bị giật. -->
    <style id="boot-css">
      #boot { --bg: #f2f4f3; --fg: #0b0c0d; --mut: #6b7177; --track: rgb(11 12 13 / 0.08);
        position: fixed; inset: 0; z-index: 9999; background: var(--bg); color: var(--fg);
        display: grid; place-items: center; transition: opacity 0.35s ease, visibility 0.35s; }
      /* Theo chế độ sáng/tối CỦA MÁY (giống ảnh màn chờ iOS), không theo cài đặt trong app: ảnh chờ → màn khởi động luôn
         trùng khớp; nếu app chọn khác máy thì đổi bằng hiệu ứng mờ dần lúc vào app, không nháy. */
      @media (prefers-color-scheme: dark) { #boot { --bg: #08090a; --fg: #f4f5f2; --mut: #8d939a; --track: rgb(255 255 255 / 0.16); } }
      #boot.out { opacity: 0; visibility: hidden; }
      /* Khung nhìn iOS có lúc "nảy" (đổi cỡ, vùng vạch Home): phủ màu nền tràn xuống dưới mép + nền html theo chế độ
         của máy khi màn khởi động còn hiện → không lộ dải màu khác ở đáy. */
      #boot { box-shadow: 0 240px 0 0 var(--bg); }
      html:has(#boot) { background: #f2f4f3; }
      @media (prefers-color-scheme: dark) { html:has(#boot) { background: #08090a; } }
      #boot .b-stack { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: calc(var(--boot-h, 100vh) * -0.04); }
      /* Mở từ màn hình chính (standalone): iOS báo chiều cao khung nhìn thấp hơn lúc vừa mở rồi mới cập nhật → căn giữa theo khung
         nhìn làm logo tụt xuống ~13pt sau khi hiện. Căn theo chiều cao THẬT của màn hình (screen.height, đúng cỡ ảnh màn chờ). */
      html.boot-fixed #boot { bottom: auto; height: var(--boot-h); }
      #boot .b-mark { position: relative; width: 92px; height: 92px; border-radius: 21px; overflow: hidden;
        box-shadow: 0 18px 36px -18px rgb(0 0 0 / 0.45), 0 2px 6px -2px rgb(0 0 0 / 0.18); }
      #boot .b-mark img { display: block; width: 100%; height: 100%; }
      #boot .b-mark::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.55), inset 0 0 0 1px rgb(0 0 0 / 0.06); }
      /* Chữ "FitBro" + dòng giới thiệu là ẢNH (scripts/gen-splash.py vẽ từ .b-word/.b-tag bằng đúng font) để không phải
         chờ font web: trước đây chữ hiện bằng font dự phòng rồi đổi sang font thật → giật/nháy. */
      #boot .b-text { margin-top: 20px; width: 300px; height: 60px; }
      #boot .b-text img { display: block; width: 300px; height: 60px; }
      #boot .b-text .dk { display: none; }
      @media (prefers-color-scheme: dark) { #boot .b-text .lt { display: none; } #boot .b-text .dk { display: block; } }
      .b-word { font: 800 32px/1 "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif; letter-spacing: -0.03em; }
      .b-tag { margin-top: 8px; font: 500 14px/1.2 "Be Vietnam Pro", system-ui, sans-serif; color: var(--mut); }
      #boot .b-bar { position: absolute; top: calc(100% + 34px); left: 50%; width: 112px; height: 4px; margin-left: -56px;
        border-radius: 99px; background: var(--track); overflow: hidden; }
      #boot .b-bar i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: inherit; background: #c6f432;
        animation: b-run 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      #boot .b-mark { animation: b-breathe 2.2s ease-in-out infinite; }
      @keyframes b-run { from { left: -40%; } to { left: 100%; } }
      @keyframes b-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
      #boot.still .b-mark, #boot.still .b-bar, #boot.still .b-bar i { animation: none; }
      #boot.still .b-bar { display: none; }
      @media (prefers-reduced-motion: reduce) { #boot .b-mark, #boot .b-bar i { animation: none; } #boot .b-bar i { left: 30%; } }
    </style>
    <!-- /BOOT:CSS -->
