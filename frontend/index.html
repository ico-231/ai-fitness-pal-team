<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Tô nền NGAY từ byte đầu tiên theo chế độ sáng/tối: nếu không, iOS tô nền trắng mặc định trong tích tắc
         giữa ảnh màn chờ và lúc trang vẽ xong → bản tối bị nháy trắng. -->
    <meta name="color-scheme" content="light dark" />
    <style>
      html { background: #f2f4f3; color-scheme: light; }
      @media (prefers-color-scheme: dark) { html { background: #08090a; color-scheme: dark; } }
      html[data-theme="light"] { background: #f2f4f3; color-scheme: light; }
      html[data-theme="dark"] { background: #08090a; color-scheme: dark; }
    </style>
    <!-- Icon tab trình duyệt. "?v=" đổi mỗi khi đổi logo: trình duyệt lưu icon rất lâu theo đúng đường dẫn. -->
    <link rel="icon" href="/favicon.ico?v=7" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=7" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=6" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- "Thêm vào Màn hình chính" (iOS/Android): mở như app thật — toàn màn hình, không thanh địa chỉ Safari.
         black-translucent: nội dung tràn lên dưới thanh trạng thái; các thanh trên đã chừa env(safe-area-inset-top). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitBro" />
    <meta name="application-name" content="FitBro" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Màn chờ iOS khi mở từ Màn hình chính (logo giữa nền màu app; sáng/tối). Sinh bằng scripts/gen-splash.py -->
    <link rel="apple-touch-startup-image" href="/splash/se-light.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/se-dark.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/x-light.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/x-dark.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/xr-light.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/xr-dark.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/xsmax-light.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/xsmax-dark.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/p12-light.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/p12-dark.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/p14pro-light.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/p14pro-dark.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/max12-light.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/max12-dark.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/max15-light.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/max15-dark.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/p16pro-light.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/p16pro-dark.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/max16-light.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/max16-dark.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f4f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="FitBro AI — huấn luyện viên AI: lên buổi tập, đếm rep bằng camera, tính calo món Việt." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <title>FitBro AI</title>
    <script>
      // áp dụng theme trước khi render để tránh nháy màn hình
      (function () {
        try {
          var t = localStorage.getItem("fitbro_theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) { document.documentElement.dataset.theme = "dark"; }
      })();
    </script>
    <!-- BOOT:CSS — màn khởi động (hiện ngay khi mở app, trước khi JS tải xong). scripts/gen-splash.py đọc khối này
         để vẽ ảnh màn chờ iOS, nên ảnh chờ và màn khởi động trùng vị trí — chuyển từ ảnh sang màn này không bị giật. -->
    <style id="boot-css">
      #boot { --bg: #f2f4f3; --fg: #0b0c0d; --mut: #6b7177; --track: rgb(11 12 13 / 0.08);
        position: fixed; inset: 0; z-index: 9999; background: var(--bg); color: var(--fg);
        display: grid; place-items: center; transition: opacity 0.35s ease, visibility 0.35s; }
      /* Theo chế độ sáng/tối CỦA MÁY (giống ảnh màn chờ iOS), không theo cài đặt trong app: ảnh chờ → màn khởi động luôn
         trùng khớp; nếu app chọn khác máy thì đổi bằng hiệu ứng mờ dần lúc vào app, không nháy. */
      @media (prefers-color-scheme: dark) { #boot { --bg: #08090a; --fg: #f4f5f2; --mut: #8d939a; --track: rgb(255 255 255 / 0.16); } }
      #boot.out { opacity: 0; visibility: hidden; }
      #boot .b-stack { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: -4vh; }
      #boot .b-mark { position: relative; width: 92px; height: 92px; border-radius: 21px; overflow: hidden;
        box-shadow: 0 18px 36px -18px rgb(0 0 0 / 0.45), 0 2px 6px -2px rgb(0 0 0 / 0.18); }
      #boot .b-mark img { display: block; width: 100%; height: 100%; }
      #boot .b-mark::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.55), inset 0 0 0 1px rgb(0 0 0 / 0.06); }
      /* Chữ "FitBro" + dòng giới thiệu là ẢNH (scripts/gen-splash.py vẽ từ .b-word/.b-tag bằng đúng font) để không phải
         chờ font web: trước đây chữ hiện bằng font dự phòng rồi đổi sang font thật → giật/nháy. */
      #boot .b-text { margin-top: 20px; width: 300px; height: 60px; }
      #boot .b-text img { display: block; width: 300px; height: 60px; }
      #boot .b-text .dk { display: none; }
      @media (prefers-color-scheme: dark) { #boot .b-text .lt { display: none; } #boot .b-text .dk { display: block; } }
      .b-word { font: 800 32px/1 "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif; letter-spacing: -0.03em; }
      .b-tag { margin-top: 8px; font: 500 14px/1.2 "Be Vietnam Pro", system-ui, sans-serif; color: var(--mut); }
      #boot .b-bar { position: absolute; top: calc(100% + 34px); left: 50%; width: 112px; height: 4px; margin-left: -56px;
        border-radius: 99px; background: var(--track); overflow: hidden; }
      #boot .b-bar i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: inherit; background: #c6f432;
        animation: b-run 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      #boot .b-mark { animation: b-breathe 2.2s ease-in-out infinite; }
      @keyframes b-run { from { left: -40%; } to { left: 100%; } }
      @keyframes b-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
      #boot.still .b-mark, #boot.still .b-bar, #boot.still .b-bar i { animation: none; }
      #boot.still .b-bar { display: none; }
      @media (prefers-reduced-motion: reduce) { #boot .b-mark, #boot .b-bar i { animation: none; } #boot .b-bar i { left: 30%; } }
    </style>
    <link rel="preload" as="image" href="/boot/word-light.png" />
    <link rel="preload" as="image" href="/boot/word-dark.png" />
    <!-- /BOOT:CSS -->
  </head>
  <body>
    <!-- BOOT:HTML -->
    <div id="boot" role="status" aria-label="Đang mở FitBro">
      <div class="b-stack">
        <div class="b-mark"><img src="/logo.png" alt="" width="92" height="92" /></div>
        <div class="b-text"><img class="lt" src="/boot/word-light.png" alt="FitBro" /><img class="dk" src="/boot/word-dark.png" alt="FitBro" /></div>
        <div class="b-bar"><i></i></div>
      </div>
    </div>
    <!-- /BOOT:HTML -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
