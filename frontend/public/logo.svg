<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo FitBro: ô vuông bo góc xanh chanh + quả tạ cách điệu (vẽ lại theo thiết kế nhóm gửi) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcff3d"/>
      <stop offset="1" stop-color="#c3f000"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <g transform="rotate(40 256 256)">
    <!-- bóng đổ mềm, lệch xuống dưới phải như ảnh gốc -->
    <g transform="translate(10 12)" opacity="0.32" filter="url(#soft)" fill="#3a4a00" stroke="#3a4a00" stroke-linecap="round">
      <rect x="196" y="241" width="120" height="30" rx="15" stroke="none"/>
      <rect x="174" y="192" width="32" height="128" rx="16" stroke="none"/>
      <rect x="306" y="192" width="32" height="128" rx="16" stroke="none"/>
      <path d="M150 178 A96 96 0 0 0 150 334" fill="none" stroke-width="28"/>
      <path d="M362 178 A96 96 0 0 1 362 334" fill="none" stroke-width="28"/>
      <path d="M398 206 A62 62 0 0 1 398 306" fill="none" stroke-width="22"/>
    </g>
    <g fill="#0d0f08" stroke="#0d0f08" stroke-linecap="round">
      <rect x="196" y="241" width="120" height="30" rx="15" stroke="none"/>
      <rect x="174" y="192" width="32" height="128" rx="16" stroke="none"/>
      <rect x="306" y="192" width="32" height="128" rx="16" stroke="none"/>
      <path d="M150 178 A96 96 0 0 0 150 334" fill="none" stroke-width="28"/>
      <path d="M362 178 A96 96 0 0 1 362 334" fill="none" stroke-width="28"/>
      <path d="M398 206 A62 62 0 0 1 398 306" fill="none" stroke-width="22"/>
    </g>
  </g>
</svg>
